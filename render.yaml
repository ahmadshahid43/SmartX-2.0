services:
  - type: web
    name: smartx
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: smartx-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: LOCALAPPDATA
        value: /data
      - key: Persistence__Provider
        value: LocalJson
      - key: Persistence__LocalDataPath
        value: /data/foundation.local.json
      - key: Persistence__InitializeFromSeedOnFirstRun
        value: "true"
      - key: Persistence__LockNonOwnerSeedUsers
        value: "true"
      - key: Persistence__RequireOwnerPasswordOnSeed
        value: "true"
      - key: Persistence__BootstrapOwnerPassword
        sync: false
